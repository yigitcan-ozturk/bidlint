[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bidlint"
version = "0.6.0"
description = "Deterministic technical specification and vendor submittal compliance analysis."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Yiğitcan Öztürk" }]
keywords = ["engineering", "architecture", "procurement", "specifications", "submittals", "compliance", "pdf", "ifc"]
dependencies = ["pypdf>=5.9,<7"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/yigitcan-ozturk/bidlint"
Repository = "https://github.com/yigitcan-ozturk/bidlint"
Issues = "https://github.com/yigitcan-ozturk/bidlint/issues"

[project.scripts]
bidlint = "bidlint.cli:main"
bidlint-mcp = "bidlint.mcp_server:main"

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
ifc = ["ifcopenshell>=0.8,<0.9"]
dev = ["pytest>=8", "ruff>=0.12,<0.16", "reportlab>=4", "mcp>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
