[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bidlint"
version = "1.2.0.dev0"
description = "Deterministic technical specification and vendor submittal compliance analysis."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Yiğitcan Öztürk" }]
keywords = ["engineering", "architecture", "procurement", "specifications", "submittals", "compliance", "pdf", "ifc"]
dependencies = ["pypdf>=5.9,<7"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/yigitcan-ozturk/bidlint"
Repository = "https://github.com/yigitcan-ozturk/bidlint"
Issues = "https://github.com/yigitcan-ozturk/bidlint/issues"

[project.scripts]
bidlint = "bidlint.entrypoint:main"
bidlint-contract = "bidlint.conformance:main"
bidlint-pilot = "bidlint.sanitize_scan:guarded_pilot_main"
bidlint-pilot-gate = "bidlint.pilot_gate:main"
bidlint-pilot-init = "bidlint.pilot_init:main"
bidlint-pilot-scan = "bidlint.sanitize_scan:main"
bidlint-pilot-verify = "bidlint.pilot_baseline:main"
bidlint-mcp = "bidlint.mcp_server:main"
bidlint-supplier-intake = "bidlint.supplier_intake_cli:main"
bidlint-supplier-review = "bidlint.supplier_response_cli:main"
bidlint-supplier-readiness = "bidlint.supplier_readiness_cli:main"
bidlint-supplier-evidence = "bidlint.supplier_evidence_cli:main"
bidlint-supplier-files = "bidlint.supplier_files_cli:main"
bidlint-supplier-history = "bidlint.supplier_history_cli:main"
bidlint-supplier-pilot = "bidlint.supplier_pilot_cli:main"

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
ifc = ["ifcopenshell>=0.8,<0.9"]
dev = ["pytest>=8", "ruff>=0.12,<0.16", "reportlab>=4", "mcp>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
