<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">bidlint technical bid compliance workflow</title>
  <desc id="desc">Specification and vendor submittal PDFs are parsed into requirements and offered facts, normalized with conservative terminology and unit rules, compared deterministically, then exported as compliance findings and multi-vendor ranking.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#0f2447}.muted{fill:#5f6f86}.small{font-size:18px}.label{font-size:20px;font-weight:700}.head{font-size:60px;font-weight:800}.sub{font-size:27px;font-weight:700}.body{font-size:19px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:17px}.card{fill:#fff;stroke:#d7e1ee;stroke-width:2}.pill{fill:#f7faff;stroke:#d7e1ee;stroke-width:1.5}.line{stroke:#1f5fd1;stroke-width:5;fill:none;stroke-linecap:round}.thin{stroke:#d7e1ee;stroke-width:2}.green{fill:#15803d}.red{fill:#dc2626}.amber{fill:#b7791f}.blue{fill:#1f5fd1}.navy{fill:#0f2447}
    </style>
  </defs>

  <rect width="1400" height="700" rx="28" fill="url(#bg)"/>

  <g transform="translate(62 58)">
    <rect x="0" y="0" width="86" height="86" rx="20" fill="#0f2447"/>
    <path d="M24 44l13 13 27-31" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="t head" x="112" y="62">bidlint</text>
    <text class="t sub" x="114" y="101">Real-world engineering bid compliance</text>
    <text class="t body muted" x="114" y="137">Evidence before confidence.</text>
  </g>

  <g transform="translate(936 62)">
    <rect class="pill" x="0" y="0" width="122" height="42" rx="12"/>
    <text class="t small" x="61" y="27" text-anchor="middle">Local</text>
    <rect class="pill" x="134" y="0" width="170" height="42" rx="12"/>
    <text class="t small" x="219" y="27" text-anchor="middle">No LLM required</text>
    <rect class="pill" x="316" y="0" width="145" height="42" rx="12"/>
    <text class="t small" x="388" y="27" text-anchor="middle">HTML · CSV · JSON</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="55" y="220" width="265" height="300" rx="22"/>
    <rect class="card" x="390" y="220" width="265" height="300" rx="22"/>
    <rect class="card" x="725" y="220" width="265" height="300" rx="22"/>
    <rect class="card" x="1060" y="220" width="285" height="300" rx="22"/>
  </g>

  <g>
    <circle cx="86" cy="252" r="19" class="navy"/><text x="86" y="259" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#fff">1</text>
    <text class="t label" x="118" y="259">Inputs</text>
    <rect x="82" y="290" width="210" height="80" rx="15" fill="#f8fbff" stroke="#d7e1ee"/>
    <text class="t label" x="105" y="323">Specification PDF</text><text class="t small muted" x="105" y="351">requirements + provenance</text>
    <rect x="82" y="390" width="210" height="96" rx="15" fill="#f8fbff" stroke="#d7e1ee"/>
    <text class="t label" x="105" y="423">Vendor submittals</text><text class="t small muted" x="105" y="452">A.pdf · B.pdf · …</text>
  </g>

  <g>
    <circle cx="421" cy="252" r="19" class="navy"/><text x="421" y="259" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#fff">2</text>
    <text class="t label" x="453" y="259">Extract</text>
    <text class="t body" x="422" y="309">Parse text-based PDFs into</text>
    <text class="t body" x="422" y="338">requirements and offered facts.</text>
    <line class="thin" x1="422" y1="373" x2="623" y2="373"/>
    <text class="t small muted" x="422" y="409">• page/source provenance</text>
    <text class="t small muted" x="422" y="442">• colon / row / paired-line fields</text>
    <text class="t small muted" x="422" y="475">• qualitative evidence preserved</text>
  </g>

  <g>
    <circle cx="756" cy="252" r="19" class="navy"/><text x="756" y="259" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#fff">3</text>
    <text class="t label" x="788" y="259">Evaluate</text>
    <text class="t body" x="757" y="307">Terminology + unit-aware rules</text>
    <rect x="758" y="336" width="200" height="54" rx="13" fill="#f0f7ff"/><text class="t mono" x="775" y="369">10000 W = 10 kW</text>
    <rect x="758" y="407" width="200" height="54" rx="13" fill="#f7faff"/><text class="t body" x="775" y="441">Deterministic compare</text>
    <text class="t small muted" x="757" y="491">Ambiguous evidence → REVIEW</text>
  </g>

  <g>
    <circle cx="1091" cy="252" r="19" class="navy"/><text x="1091" y="259" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#fff">4</text>
    <text class="t label" x="1123" y="259">Findings + ranking</text>
    <rect x="1093" y="294" width="220" height="46" rx="12" fill="#ecfdf3"/><text class="green label" x="1110" y="324">PASS</text><text class="t small" x="1195" y="324">Motor power</text>
    <rect x="1093" y="350" width="220" height="46" rx="12" fill="#fff1f2"/><text class="red label" x="1110" y="380">DEVIATION</text><text class="t small" x="1233" y="380">IP54 &lt; IP65</text>
    <rect x="1093" y="406" width="220" height="46" rx="12" fill="#eef5ff"/><text class="blue label" x="1110" y="436">REVIEW</text><text class="t small" x="1205" y="436">material</text>
    <rect x="1093" y="462" width="220" height="46" rx="12" fill="#fff8e8"/><text class="amber label" x="1110" y="492">MISSING</text><text class="t small" x="1212" y="492">noise</text>
  </g>

  <g class="line">
    <path d="M330 370h48"/><path d="M368 357l15 13-15 13"/>
    <path d="M665 370h48"/><path d="M703 357l15 13-15 13"/>
    <path d="M1000 370h48"/><path d="M1038 357l15 13-15 13"/>
  </g>

  <g transform="translate(55 564)">
    <rect x="0" y="0" width="1290" height="82" rx="20" fill="#0f2447"/>
    <text x="34" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#fff">Technical bid tabulation</text>
    <text x="34" y="61" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" fill="#cbd8ea">Vendor B 100%  ·  Vendor A 50%  ·  traceable requirement-by-vendor matrix</text>
    <text x="1255" y="51" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#9fc2ff">transparent · repeatable · auditable</text>
  </g>
</svg>
