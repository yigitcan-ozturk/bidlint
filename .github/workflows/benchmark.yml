name: benchmark

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  large-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check benchmarks
      - name: Run deterministic 20k-fact benchmark
        run: python benchmarks/large_package.py --parameters 5000 --duplicates 4 --repeats 3 --max-seconds 15
      - name: Run production-shaped conflict and memory profile
        run: >-
          python benchmarks/production_profile.py
          --parameters 6000
          --duplicates 4
          --conflict-every 25
          --repeats 2
          --max-seconds 20
          --max-peak-mib 256
