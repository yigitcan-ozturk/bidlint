name: publish-pypi

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable release tag to publish (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build validated distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify stable tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable SemVer tag such as v1.0.0; got $RELEASE_TAG"
            exit 1
          fi

          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]

          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"Refusing to publish non-stable package version: {version}")
          if tag != f"v{version}":
              raise SystemExit(f"Tag/package mismatch: tag={tag}, package={version}")

          print(f"Validated {tag} -> bidlint {version}")
          PY

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
          sha256sum dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bidlint
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
