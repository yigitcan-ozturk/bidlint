name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read package version
        id: version
        shell: bash
        run: |
          VERSION="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub release when missing
        if: steps.version.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="v${VERSION}"
          TAG_EXISTS=false

          # A stable release may reuse an existing tag only when it already
          # resolves to this exact main-branch commit. This prevents a stale or
          # premature tag from silently becoming authoritative release evidence.
          git fetch --force --tags origin
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            TAG_EXISTS=true
            TAG_SHA="$(git rev-list -n 1 "$TAG")"
            if [[ "$TAG_SHA" != "$GITHUB_SHA" ]]; then
              echo "::error::${TAG} already exists at ${TAG_SHA}, but this release commit is ${GITHUB_SHA}. Delete or explicitly invalidate the stale tag before releasing."
              exit 1
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$TAG_EXISTS" != "true" ]]; then
              echo "::error::GitHub release ${TAG} exists but its repository tag is missing. Repair release/tag state before retrying."
              exit 1
            fi
            echo "$TAG already exists and resolves to this exact commit; nothing to do."
            exit 0
          fi

          NOTES="docs/releases/${TAG}.md"
          if [[ -f "$NOTES" ]]; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "bidlint $TAG" \
              --notes-file "$NOTES"
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "bidlint $TAG" \
              --generate-notes
          fi
