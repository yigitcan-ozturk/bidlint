name: package

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel-smoke:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python -m pip check
      - run: bidlint --version
      - run: python -m bidlint --version
      - run: bidlint-contract --manifest
      - run: bidlint-pilot --help
      - run: bidlint-pilot-init --help
      - run: bidlint-pilot-scan --help
      - run: bidlint-pilot-verify --help

  runtime-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip pip-audit
      - name: Export runtime dependencies
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          dependencies = data["project"].get("dependencies", [])
          Path(".audit-requirements.txt").write_text("\n".join(dependencies) + "\n", encoding="utf-8")
          PY
      - run: python -m pip_audit -r .audit-requirements.txt
